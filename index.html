<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="css/12-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button"><img src="image/rock-emoji.png" class="move-icon"></button>

    <button class="move-button js-paper-button"><img src="image/paper-emoji.png" class="move-icon"></button>

    <button class="move-button js-scissors-button"><img src="image/scissors-emoji.png" class="move-icon"></button>

    <p class="js-button result"></p>
    <p class="js-prob prob"></p>
    <p class="js-score score"></p>
    <button onclick="score.wins=0,
    score.losses=0,
    score.ties=0,
    localStorage.removeItem('score');
    updateScoreElement();
    " class="reset">Reset</button>
    <button class="auto-play-button" >
      Auto Play
    </button>

   <script src="script/12-rock-paper-scissors.js"></script>
  </body>
</html>
